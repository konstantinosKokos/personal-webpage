<ul>
    $for(talks)$
        <li>
            <div><a class="talktitle" href="$url$">$title$</a></div>
            <div> $date$ in $in$</div>
            $if(venue_link)$
                <div>$type$ @ <a class="venue" href="$venue_link$">$at$</a></div>
            $else$
                <div>$type$ @ <span class="venue">$at$</span> in $in$</div>
            $endif$
        </li>
    $endfor$
</ul>
